<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: url(#textGrad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; letter-spacing: 1.5px; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Dynamic SVG Animations */
    .pulse-route { stroke-dasharray: 12, 12; animation: dash 30s linear infinite; }
    .ping-point { animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
    .ping-point-delayed { animation: ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite 0.8s; }

    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
    @keyframes ping {
      75%, 100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M150 0 V300 M300 0 V300 M450 0 V300 M600 0 V300 M750 0 V300 M900 0 V300 M1050 0 V300" stroke="url(#gridGrad)" stroke-width="1" />

  <!-- Dynamic Delivery Route Graphic -->
  <g stroke-linecap="round">
    <path class="pulse-route" d="M 100 220 Q 250 80, 450 180 T 800 120 T 1100 200" fill="none" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" opacity="0.8" />
    <path class="pulse-route" d="M 100 220 Q 250 80, 450 180 T 800 120 T 1100 200" fill="none" stroke="#818cf8" stroke-width="2" />
  </g>

  <!-- Waypoints & Pings -->
  <g id="waypoints">
    <!-- Hub Point -->
    <circle cx="100" cy="220" r="8" fill="#38bdf8" />
    <circle cx="100" cy="220" r="16" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" />
    
    <!-- Delivery Node 1 -->
    <circle cx="450" cy="180" r="6" fill="#818cf8" />
    
    <!-- Delivery Node 2 (Active Ping) -->
    <g transform="translate(800, 120)">
      <circle cx="0" cy="0" r="10" fill="#c084fc" opacity="0.4" class="ping-point" />
      <circle cx="0" cy="0" r="6" fill="#c084fc" />
    </g>

    <!-- Destination Node (Active Ping) -->
    <g transform="translate(1100, 200)">
      <circle cx="0" cy="0" r="12" fill="#38bdf8" opacity="0.4" class="ping-point-delayed" />
      <circle cx="0" cy="0" r="7" fill="#38bdf8" />
    </g>
  </g>

  <!-- Text & Branding -->
  <g transform="translate(80, 115)">
    <!-- Top Pill Badge -->
    <rect x="0" y="-45" width="230" height="30" rx="15" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="15" y="-25" class="badge-text">🚚 LAST-MILE LOGISTICS</text>

    <!-- Main Title -->
    <text x="0" y="25" class="title">Awesome Last-Mile Delivery</text>

    <!-- Subtitle -->
    <text x="0" y="65" class="subtitle">Curated SaaS Platforms, Route Optimization &amp; Open-Source Dispatch Engines</text>
  </g>
</svg>
